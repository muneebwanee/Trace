      - name: Generate & Verify Fresh Upload Keystore for Play Store Signing
        run: |
          cd _build_android/app
          rm -f upload-keystore.jks release-upload-keystore.jks
          keytool -genkeypair -v -keystore upload-keystore.jks -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "trace_upload_2026" -keypass "trace_upload_2026" -dname "CN=muneebwanee, OU=Trace, O=Trace, L=Srinagar, S=JK, C=IN"
          keytool -list -v -keystore upload-keystore.jks -storepass "trace_upload_2026" -alias upload > /dev/null
          cp upload-keystore.jks release-upload-keystore.jks

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Play Store Bundle (.aab) & Universal APK (.apk)
        working-directory: _build_android
        run: |
          gradle bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/*.aab ../release-out/Trace_PlayStore_API36.aab
          cp app/build/outputs/apk/release/*.apk ../release-out/Trace_Universal_API36.apk
          ls -lh ../release-out/

      - name: Upload Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trace-Android-PlayStore-API36
          path: |
            release-out/Trace_PlayStore_API36.aab
            release-out/Trace_Universal_API36.apk
          if-no-files-found: error

      - name: Publish Android AAB & APK to Unified GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v0.0.1-universal
          name: "Trace 0.0.1v — Official Store Releases (iOS .ipa • Android .aab/.apk • Windows .appx/.exe • Linux .AppImage/.deb)"
          files: |
            release-out/Trace_PlayStore_API36.aab
            release-out/Trace_Universal_API36.apk
