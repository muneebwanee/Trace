                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "0.0.1"
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("upload-keystore.jks")
                      storePassword "trace_upload_2026"
                      keyAlias "upload"
                      keyPassword "trace_upload_2026"
                  }
              }

              buildTypes {
