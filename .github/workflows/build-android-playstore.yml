                      requestWindowFeature(Window.FEATURE_NO_TITLE);
                      super.onCreate(savedInstanceState);
                      if (getActionBar() != null) {
                          getActionBar().hide();
                      }

                      boolean systemNight = (getResources().getConfiguration().uiMode
                              & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                      SharedPreferences wPrefs = getSharedPreferences(TraceWidgetProvider.WIDGET_PREFS, Context.MODE_PRIVATE);
                      boolean initialDark = wPrefs.contains(TraceWidgetProvider.KEY_DARK_MODE)
                              ? wPrefs.getBoolean(TraceWidgetProvider.KEY_DARK_MODE, systemNight)
                              : systemNight;

                      final int fallbackStatusTop = getStatusBarHeightPx();

                      rootLayout = new FrameLayout(this);
                      rootLayout.setFitsSystemWindows(true);
                      rootLayout.setPadding(0, fallbackStatusTop, 0, 0);

                      rootLayout.setOnApplyWindowInsetsListener((v, insets) -> {
                          int topInset = insets.getSystemWindowInsetTop();
                          int bottomInset = insets.getSystemWindowInsetBottom();
                          int leftInset = insets.getSystemWindowInsetLeft();
                          int rightInset = insets.getSystemWindowInsetRight();
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              android.graphics.Insets bars = insets.getInsets(
                                      WindowInsets.Type.systemBars()
                                              | WindowInsets.Type.displayCutout()
                                              | WindowInsets.Type.ime()
                              );
                              topInset = bars.top;
                              bottomInset = bars.bottom;
                              leftInset = bars.left;
                              rightInset = bars.right;
                          }
                          int safeTop = Math.max(topInset, fallbackStatusTop);
                          v.setPadding(leftInset, safeTop, rightInset, bottomInset);
                          return insets;
                      });

                      webView = new WebView(this);
                      applySystemBarTheme(initialDark);

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setLoadWithOverviewMode(true);
                      settings.setUseWideViewPort(true);

                      webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              restoreFromInternalAutoBackupIfNeeded();
                              Intent launchIntent = getIntent();
                              if (launchIntent != null) {
                                  String wAction = launchIntent.getStringExtra("widget_action");
                                  if ("calendar".equals(wAction)) {
                                      view.evaluateJavascript("if(window.__openTraceCalendarFromWidget){window.__openTraceCalendarFromWidget();}", null);
                                  } else if ("write_today".equals(wAction)) {
                                      view.evaluateJavascript("if(window.__focusTraceTodayFromWidget){window.__focusTraceTodayFromWidget();}", null);
                                  }
                              }
                          }
                      });

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onShowFileChooser(
                                  WebView webView,
                                  ValueCallback<Uri[]> filePathCallback,
                                  FileChooserParams fileChooserParams
                          ) {
                              if (MainActivity.this.filePathCallback != null) {
                                  MainActivity.this.filePathCallback.onReceiveValue(null);
                              }
                              MainActivity.this.filePathCallback = filePathCallback;

                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                              startActivityForResult(Intent.createChooser(intent, "Select File or Font"), FILE_CHOOSER_REQUEST_CODE);
